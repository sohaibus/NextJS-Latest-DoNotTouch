version: 1
backend:
    phases:
      preBuild:
        commands:
          - echo "preBuild done"
      build:
        commands:
          - amplifyPush --simple
frontend:
  phases:
    preBuild:
      commands:
        - npm install -g pnpm@latest-10
        - pnpm install
        - ./patch-next.sh
    build:
      commands:
        - pnpm run build
  artifacts:
    baseDirectory: .next
    files:
      - "**/*"
